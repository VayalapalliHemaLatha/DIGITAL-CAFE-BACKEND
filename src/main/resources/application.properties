spring.application.name=digital-cafe

server.port=8080

# MySQL (local)
spring.datasource.url=jdbc:mysql://localhost:3306/digital_cafe?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (use a long random secret in production)
app.jwt.secret=DigitalCafeSecretKeyForJWTTokenGenerationAtLeast256BitsLong
app.jwt.expiration-ms=86400000

# Disable LiveReload to avoid "Unable to start LiveReload server" when its port is in use
spring.devtools.livereload.enabled=false
# Razorpay: env RAZORPAY_KEY_ID/RAZORPAY_KEY_SECRET or RZP_KEY_ID/RZP_KEY_SECRET, else defaults
rzp.key_id=${RAZORPAY_KEY_ID:${RZP_KEY_ID:rzp_test_SR5vgOK1sYmlr5}}
rzp.key_secret=${RAZORPAY_KEY_SECRET:${RZP_KEY_SECRET:YAMFuNc9gAA7S4rNkPhrB5Er}}
rzp.currency=INR
rzp.company_name=Digital Cafe

